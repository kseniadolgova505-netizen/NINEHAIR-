<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка — Долгова Ксения | NINEHAIR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #090909;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #ffffff;
    }
    .card {
      background: #141414;
      width: 100%;
      max-width: 440px;
      border-radius: 26px;
      padding: 34px 24px;
      border: 1px solid #262626;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      text-align: center;
    }
    .brand {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #d8ed1c;
      background: rgba(216, 237, 28, 0.12);
      border: 1px solid rgba(216, 237, 28, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .role {
      font-size: 15px;
      color: #9e9e9e;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }
    .btn-primary {
      display: block;
      background: #d8ed1c;
      color: #0d0d0d;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      background: #1f1f1f;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #303030;
      cursor: pointer;
    }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      border-top: 1px solid #242424;
      padding-top: 24px;
    }
    .qr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .qr-box {
      background: #ffffff;
      border: 2px solid #d8ed1c;
      border-radius: 14px;
      padding: 7px;
      margin-bottom: 8px;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .qr-label {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }
    .qr-sub {
      font-size: 10px;
      color: #d8ed1c;
      margin-top: 2px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">NINEHAIR</div>
    <h1>Долгова Ксения</h1>
    <div class="role">Директор</div>

    <div class="actions">
      <a href="tel:+79224479447" class="btn-primary">+7 (922) 447-94-47</a>
      <button type="button" onclick="openVCard()" class="btn-secondary">Сохранить контакт в телефон</button>
    </div>

    <div class="qr-grid">
      <!-- QR 1: Контакт vCard -->
      <div onclick="openVCard()" class="qr-item">
        <div class="qr-box">
          <img src="https://qrserver.com" alt="QR Контакт">
        </div>
        <div class="qr-label">Контакт</div>
        <div class="qr-sub">Нажать / Сканировать</div>
      </div>

      <!-- QR 2: Приложение -->
      <a href="https://ninehair.ru" target="_blank" class="qr-item">
        <div class="qr-box">
          <img src="https://qrserver.com" alt="QR Приложение">
        </div>
        <div class="qr-label">Приложение</div>
        <div class="qr-sub">app.ninehair.ru</div>
      </a>

      <!-- QR 3: Instagram (обновлённая ссылка) -->
      <a href="https://www.instagram.com/ninehair.ru?avpt=MXV5d3JlYXZtYjVyZA%3D%3D&utm_source=qr" target="_blank" class="qr-item">
        <div class="qr-box">
          <img src="https://qrserver.com" alt="QR Instagram">
        </div>
        <div class="qr-label">Instagram</div>
        <div class="qr-sub">@ninehair.ru</div>
      </a>
    </div>
  </div>

  <script>
    function openVCard() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N;CHARSET=UTF-8:Долгова;Ксения;;;",
        "FN;CHARSET=UTF-8:Долгова Ксения",
        "ORG;CHARSET=UTF-8:NINEHAIR",
        "TITLE;CHARSET=UTF-8:Директор",
        "TEL;TYPE=CELL:+79224479447",
        "URL:https://www.instagram.com/ninehair.ru?avpt=MXV5d3JlYXZtYjVyZA%3D%3D&utm_source=qr",
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      window.location.href = URL.createObjectURL(blob);
    }
  </script>

</body>
</html>
