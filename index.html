  <script>
    // Встроенный автономный генератор QR (без загрузки из интернета)
    const QR = (() => {
      const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        EXP[i] = x; LOG[x] = i;
        x <<= 1; if (x & 256) x ^= 285;
      }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

      const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
      const polyMul = (p, q) => {
        const r = new Uint8Array(p.length + q.length - 1);
        for (let i = 0; i < p.length; i++)
          for (let j = 0; j < q.length; j++) r[i + j] ^= mul(p[i], q[j]);
        return r;
      };
      const rsGen = (n) => {
        let g = new Uint8Array([1]);
        for (let i = 0; i < n; i++) g = polyMul(g, new Uint8Array([1, EXP[i]]));
        return g;
      };
      const rsRem = (data, gen) => {
        const res = new Uint8Array(gen.length - 1);
        for (let i = 0; i < data.length; i++) {
          const factor = data[i] ^ res[0];
          res.copyWithin(0, 1); res[res.length - 1] = 0;
          if (factor) for (let j = 0; j < res.length; j++) res[j] ^= mul(gen[j + 1], factor);
        }
        return res;
      };

      // Таблица версий 1-10 (уровень коррекции L: [totalBytes, ecBytes, blocks])
      const VER = [
        null,
, [44, 10, 1], [70, 15, 1], [100, 20, 1], [134, 26, 1],
, [196, 20, 2], [242, 24, 2], [292, 30, 2], [346, 18, 4]
      ];
      const ALIGN = [[], [], [6,18], [6,22], [6,26], [6,30], [6,34], [6,22,38], [6,24,42], [6,26,46], [6,28,50]];

      return function draw(canvas, text) {
        const bytes = new TextEncoder().encode(text);
        let v = 1;
        while (v <= 10 && (VER[v][0] - VER[v][1] * VER[v][2]) < bytes.length + (v < 10 ? 2 : 3)) v++;
        if (v > 10) return;

        const [total, ecPerBlock, blocks] = VER[v];
        const dataCap = total - ecPerBlock * blocks;
        const bits = [];
        const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
        push(4, 4);
        push(bytes.length, v < 10 ? 8 : 16);
        bytes.forEach(b => push(b, 8));
        push(0, Math.min(4, dataCap * 8 - bits.length));
        while (bits.length % 8) bits.push(0);
        const pad =;
        for (let i = 0; bits.length < dataCap * 8; i++) push(pad[i % 2], 8);

        const dataBytes = new Uint8Array(dataCap);
        for (let i = 0; i < dataCap; i++)
          for (let b = 0; b < 8; b++) dataBytes[i] = (dataBytes[i] << 1) | bits[i * 8 + b];

        const gen = rsGen(ecPerBlock);
        const dBlocks = [], eBlocks = [];
        const shortBlocks = blocks - (dataCap % blocks);
        const shortLen = Math.floor(dataCap / blocks);
        let offset = 0;
        for (let b = 0; b < blocks; b++) {
          const len = shortLen + (b >= shortBlocks ? 1 : 0);
          const db = dataBytes.slice(offset, offset + len);
          offset += len;
          dBlocks.push(db);
          eBlocks.push(rsRem(db, gen));
        }

        const code = [];
        for (let i = 0; i < shortLen + 1; i++)
          for (let b = 0; b < blocks; b++) if (i < dBlocks[b].length) code.push(dBlocks[b][i]);
        for (let i = 0; i < ecPerBlock; i++)
          for (let b = 0; b < blocks; b++) code.push(eBlocks[b][i]);

        const size = v * 4 + 17;
        const grid = Array.from({ length: size }, () => new Int8Array(size));
        const func = Array.from({ length: size }, () => new Uint8Array(size));
        const set = (r, c, val, isFunc = true) => {
          if (r >= 0 && r < size && c >= 0 && c < size) { grid[r][c] = val; if (isFunc) func[r][c] = 1; }
        };
        const finder = (r, c) => {
          for (let dr = -1; dr <= 7; dr++)
            for (let dc = -1; dc <= 7; dc++) {
              const on = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6 && (dr === 0 || dr === 6 || dc === 0 || dc === 6 || (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4));
              set(r + dr, c + dc, on ? 1 : 0);
            }
        };
        finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
        const ap = ALIGN[v];
        for (let i = 0; i < ap.length; i++)
          for (let j = 0; j < ap.length; j++) {
            if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) continue;
            for (let dr = -2; dr <= 2; dr++)
              for (let dc = -2; dc <= 2; dc++)
                set(ap[i] + dr, ap[j] + dc, (Math.abs(dr) === 2 || Math.abs(dc) === 2 || (!dr && !dc)) ? 1 : 0);
          }
