      color: #ffffff;
    }

      margin-bottom: 24px;
    }
    .actions {

      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }
    .btn-primary {
      display: block;
      background: #d8ed1c;
      color: #0d0d0d;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 16px;

    .btn-secondary {

      text-decoration: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #303030;
      cursor: pointer;
    }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      border-top: 1px solid #242424;
      padding-top: 24px;
    }
    .qr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .qr-box {
      background: #ffffff;
      border: 2px solid #d8ed1c;
      border-radius: 14px;
      padding: 7px;
      margin-bottom: 8px;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box svg {

      height: 100%;
      display: block;
    }
    .qr-label {

    }
